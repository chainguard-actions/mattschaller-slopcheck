name: Test scanning a specific file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm run build

      - name: Create a specific markdown file to scan
        run: |
          mkdir -p /tmp/slopcheck-file
          cat > /tmp/slopcheck-file/docs.md << 'EOF'
          # Documentation

          No npm install commands here. Just plain text documentation.

          ## Overview

          This document describes the project architecture.
          EOF
          # Create another file that won't be scanned
          cat > /tmp/slopcheck-file/other.md << 'EOF'
          # Other

          npx some-totally-fake-package-xyz-12345
          EOF

      - name: Run slopcheck on specific file only (not the other file)
        id: action
        uses: .
        with:
          paths: '/tmp/slopcheck-file/docs.md'
          concurrency: '5'

      - name: Assert action succeeded (only clean file was scanned)
        run: |
          echo "Action completed successfully — specific file scanned without issues"
          echo "PASS"
