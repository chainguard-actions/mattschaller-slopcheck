name: Test basic clean scan (no package references)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        working-directory: ${{ github.workspace }}
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm run build

      - name: Create a clean markdown file with no npm references
        run: |
          mkdir -p /tmp/slopcheck-test
          cat > /tmp/slopcheck-test/README.md << 'EOF'
          # My Project

          This is a simple project with no npm install commands.

          ## Usage

          Just run the application directly.
          EOF

      - name: Run slopcheck on clean directory
        id: action
        uses: .
        with:
          paths: '/tmp/slopcheck-test'
          concurrency: '5'

      - name: Assert action succeeded (no phantom packages)
        run: |
          echo "Action completed successfully — no phantom packages found"
          echo "PASS"
