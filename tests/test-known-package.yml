name: Test scan with known real npm package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm run build

      - name: Create markdown file referencing a real npm package
        run: |
          mkdir -p /tmp/slopcheck-known
          cat > /tmp/slopcheck-known/AGENTS.md << 'EOF'
          # Agent Instructions

          Install the following packages to set up the environment:

          ```bash
          npm install react
          npm install typescript
          ```

          These are well-known packages available on npm.
          EOF

      - name: Run slopcheck on file with known packages
        id: action
        uses: .
        with:
          paths: '/tmp/slopcheck-known'
          concurrency: '5'

      - name: Assert action succeeded (all packages found on npm)
        run: |
          echo "Action completed successfully — all referenced packages exist on npm"
          echo "PASS"
