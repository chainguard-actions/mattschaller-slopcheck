name: Test basic scan with no npm package references
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install pre-built dist so the action can run without building from source
      - name: Install pre-built dist
        run: |
          set -e
          echo "=== Setting up pre-built dist ==="
          mkdir -p "$GITHUB_WORKSPACE/action/dist"
          cp "$GITHUB_WORKSPACE/tests/fixtures/prebuilt-dist/index.js" "$GITHUB_WORKSPACE/action/dist/index.js"
          cp "$GITHUB_WORKSPACE/tests/fixtures/prebuilt-dist/package.json" "$GITHUB_WORKSPACE/action/dist/package.json"
          # Also copy to workspace root in case act resolves uses: . to workspace root
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/tests/fixtures/prebuilt-dist/index.js" "$GITHUB_WORKSPACE/dist/index.js"
          cp "$GITHUB_WORKSPACE/tests/fixtures/prebuilt-dist/package.json" "$GITHUB_WORKSPACE/dist/package.json"
          echo "=== Pre-built dist installed: ==="
          ls -la "$GITHUB_WORKSPACE/action/dist/"

      - id: action
        uses: .
        with:
          paths: '${{ github.workspace }}/tests/fixtures/no-packages'
          concurrency: '5'

      - name: Assert action succeeded (no phantom packages found)
        run: |
          echo "Action completed successfully — no phantom packages detected"
          echo "PASS"
