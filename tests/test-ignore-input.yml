name: Test ignore input skips specified packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        run: |
          npm install
          npm run build

      - id: action
        uses: .
        with:
          paths: 'tests/fixtures/ignore-test'
          ignore: 'totally-fake-hallucinated-pkg-xyz-12345'
          concurrency: '5'

      - name: Assert action succeeded (phantom package was ignored)
        run: |
          echo "Action completed successfully — phantom package was skipped via ignore input"
          echo "PASS"
