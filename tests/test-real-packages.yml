name: Test scan with real existing npm packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          npm run build

      - name: Create temp scan directory with real npm package references
        run: |
          mkdir -p /tmp/scan-real
          cat > /tmp/scan-real/INSTALL.md << 'EOF'
          # Installation

          Install the following well-known packages:

          ```bash
          npm install express
          npm install lodash
          npx typescript --version
          ```
          EOF

      - name: Run slopcheck on directory with real packages
        id: action
        uses: .
        with:
          paths: '/tmp/scan-real'
          concurrency: '5'

      - name: Assert action succeeded (all packages exist on npm)
        run: |
          echo "Action completed successfully — all referenced packages exist on npm"
          echo "PASS"
