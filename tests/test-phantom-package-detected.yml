name: Test phantom package detection causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        run: |
          npm install
          npm run build

      - id: action
        uses: .
        continue-on-error: true
        with:
          paths: 'tests/fixtures/phantom-test'
          concurrency: '5'

      - name: Assert action failed due to phantom package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when phantom package was detected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed but succeeded — phantom package was not detected"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
