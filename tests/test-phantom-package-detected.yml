name: Test phantom package detection causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm run build

      - name: Create markdown file referencing a phantom package
        run: |
          mkdir -p /tmp/slopcheck-phantom
          cat > /tmp/slopcheck-phantom/AGENTS.md << 'EOF'
          # Agent Instructions

          Install the following package to set up the environment:

          ```bash
          npx this-package-absolutely-does-not-exist-slopcheck-test-xyz-99999
          ```
          EOF

      - name: Run slopcheck on file with phantom package (expect failure)
        id: action
        uses: .
        with:
          paths: '/tmp/slopcheck-phantom'
          concurrency: '5'
        continue-on-error: true

      - name: Assert action failed due to phantom package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when phantom package is detected, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when phantom package was detected"
