name: Test phantom package detection causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build action
        working-directory: ${{ github.workspace }}
        run: |
          npm install
          npm run build

      - name: Create temp scan directory with a phantom package reference
        run: |
          mkdir -p /tmp/scan-phantom
          cat > /tmp/scan-phantom/AGENTS.md << 'EOF'
          # Agent Instructions

          Use this tool to transform code:

          ```bash
          npx this-package-absolutely-does-not-exist-slopcheck-test-xyz-99999
          ```
          EOF

      - name: Run slopcheck expecting failure for phantom package
        id: action
        uses: .
        with:
          paths: '/tmp/scan-phantom'
          concurrency: '5'
        continue-on-error: true

      - name: Assert action failed (phantom package detected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when phantom package is detected, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when phantom package was detected"
